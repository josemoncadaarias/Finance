<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancelled.emit()" [attr.aria-label]="'entry.cancel' | t">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <h1 class="title">{{ title() }}</h1>

    <ion-buttons slot="end">
      <ion-button class="save" [disabled]="!canSave() || saving()" (click)="save()">
        <ion-icon slot="start" name="checkmark-outline"></ion-icon>
        {{ 'entry.save' | t }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<div class="editor-body">
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <section class="identity">
    <app-icon-picker [catalog]="catalog" [builtin]="builtinIcon()"
                     [custom]="customIconId()" (chosen)="onIcon($event)"></app-icon-picker>

    <ion-input class="name" [value]="name()" [placeholder]="'categories.namePlaceholder' | t"
               (ionInput)="name.set($any($event.target).value ?? '')"></ion-input>
  </section>

  <!-- No side to choose: a movement of a product alone is not filed as
       spending or as income. -->
  @if (!isNew()) {
    <ion-list [inset]="true">
      <ion-item lines="full">
        <ion-label>{{ 'categories.usedIn' | t }}</ion-label>
        <ion-note slot="end">{{ 'categories.inUse' | t:{ count: usedBy() } }}</ion-note>
      </ion-item>

      <!-- Archived, never deleted: what was recorded under it keeps its name. -->
      <ion-item>
        <ion-toggle [checked]="archived()"
                    (ionChange)="archived.set($any($event.detail).checked)">
          <div>
            <p class="strong">{{ 'categories.archive' | t }}</p>
            <p class="hint">{{ 'categories.archive.hint' | t }}</p>
          </div>
        </ion-toggle>
      </ion-item>
    </ion-list>
  }

  @if (missing(); as hint) {
    <p class="missing">{{ hint }}</p>
  }
</div>
