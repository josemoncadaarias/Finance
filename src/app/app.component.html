<ion-app>
  <!--
    Navigation is a bar that FLOATS above the bottom edge (group 8 of the
    redesign, approved by Jose on 2026-09-28): Inicio, Cuentas, the "+",
    Reporte, Más. It replaced the drawer, which had been chosen because
    Android's own buttons own the bottom strip - the bar keeps its own margin
    and the safe-area inset under it, so it never shares that strip.
  -->
  <ion-router-outlet id="main"></ion-router-outlet>

  <app-tab-bar></app-tab-bar>

  <!-- What the "+" opens, on every screen: one sheet, one movement form, and
       importing a statement. -->
  <app-compose-host></app-compose-host>
  <app-statement-flow></app-statement-flow>
  <app-toast></app-toast>
</ion-app>
