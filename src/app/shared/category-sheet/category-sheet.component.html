<!-- Every category, searchable (mockup 1m): the sheet the review screen and
     the notifications open to file something. -->
<ion-modal class="ui-sheet tall" [isOpen]="open()" (willPresent)="opened()" (didDismiss)="cancelled.emit()">
  <ng-template>
    <div class="ui-sheet-body">
      <div class="grab"></div>
      <div class="sheet-head">
        <button type="button" class="link left" (click)="cancelled.emit()">{{ 'entry.cancel' | t }}</button>
        <h2>{{ 'entry.pickCategory' | t }}</h2>
        <span class="right"></span>
      </div>
      <div class="ui-search">
        <ion-icon name="search-outline"></ion-icon>
        <input type="search" [placeholder]="'entry.searchCategory' | t" [value]="search()"
               (input)="search.set($any($event.target).value ?? '')">
      </div>
      <div class="ui-seg order">
        <button type="button" [class.on]="order() === 'use'" (click)="setOrder('use')">{{ 'entry.order.use' | t }}</button>
        <button type="button" [class.on]="order() === 'name'" (click)="setOrder('name')">{{ 'entry.order.name' | t }}</button>
      </div>
      <div class="ui-list">
        @for (category of found(); track category.id) {
          <button type="button" class="ui-row" (click)="choose(category.id)">
            <app-badge [size]="42" [builtin]="category.builtin_icon" [customId]="category.custom_icon_id"
                       [tone]="category.color" [seed]="category.id"></app-badge>
            <span class="ui-tx">
              <b class="ui-one">{{ category.name }}</b>
              <small>{{ category.times > 0 ? (category.times === 1 ? ('entry.timesUsed.one' | t) : ('entry.timesUsed' | t:{ count: category.times })) : ('entry.neverUsed' | t) }}</small>
            </span>
            @if (chosen() === category.id) {
              <span class="ui-tick on"><ion-icon name="checkmark"></ion-icon></span>
            }
          </button>
        }
      </div>
    </div>
  </ng-template>
</ion-modal>
