<ion-modal [isOpen]="open()" (didDismiss)="closed.emit()">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="closed.emit()">{{ 'entry.cancel' | t }}</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="picker">
      <h2>{{ heading() ?? ('entry.fromWhere' | t) }}</h2>

      <div class="order-pills">
        <button type="button" [class.on]="order() === 'use'" (click)="setOrder('use')">{{ 'entry.order.use' | t }}</button>
        <button type="button" [class.on]="order() === 'name'" (click)="setOrder('name')">{{ 'entry.order.name' | t }}</button>
      </div>

      <ion-list>
        @for (option of ordered(); track option.id) {
          <ion-item button lines="full" (click)="choose(option)" [class.selected]="selectedId() === option.id">
            <app-icon slot="start" [builtin]="option.builtin_icon"
                      [customId]="option.custom_icon_id" fallback="wallet"></app-icon>
            <ion-label>
              <h3>{{ option.name }}</h3>
              <p>{{ option.currency_code }}</p>
            </ion-label>
            @if (selectedId() === option.id) {
              <ion-icon slot="end" class="tick" name="checkmark-circle"
                        [attr.aria-label]="'entry.selected' | t"></ion-icon>
            }
          </ion-item>
        }
      </ion-list>
    </ion-content>
  </ng-template>
</ion-modal>
