<ion-modal class="ui-sheet" [isOpen]="open()" (didDismiss)="closed.emit()">
  <ng-template>
    <div class="ui-sheet-body">
      <div class="grab"></div>
      <div class="sheet-head">
        <button type="button" class="link left" (click)="closed.emit()">{{ 'entry.cancel' | t }}</button>
        <h2>{{ heading() ?? ('entry.fromWhere' | t) }}</h2>
        <span class="right"></span>
      </div>

      @if (showAll()) {
        <div class="ui-list">
          <button type="button" class="ui-row" (click)="chosenAll.emit()">
            <span class="all-badge"><ion-icon name="layers-outline"></ion-icon></span>
            <span class="ui-tx">
              <b>{{ 'ui.allAccounts' | t }}</b>
              @if (allDetail()) { <small>{{ allDetail() }}</small> }
            </span>
            @if (selectedId() === null) {
              <span class="ui-tick on"><ion-icon name="checkmark"></ion-icon></span>
            }
          </button>
        </div>
      }

      <div class="ui-seg order">
        <button type="button" [class.on]="order() === 'use'" (click)="setOrder('use')">{{ 'entry.order.use' | t }}</button>
        <button type="button" [class.on]="order() === 'name'" (click)="setOrder('name')">{{ 'entry.order.name' | t }}</button>
      </div>

      <div class="ui-list">
        @for (option of ordered(); track option.id) {
          <button type="button" class="ui-row" (click)="choose(option)">
            <app-badge shape="ci" [size]="42" [builtin]="option.builtin_icon" [customId]="option.custom_icon_id"
                       [tone]="option.color" [seed]="option.id" fallback="wallet"></app-badge>
            <span class="ui-tx">
              <b>{{ option.name }}</b>
              <small>{{ lineOf(option) }}</small>
            </span>
            @if (selectedId() === option.id) {
              <span class="ui-tick on" [attr.aria-label]="'entry.selected' | t"><ion-icon name="checkmark"></ion-icon></span>
            }
          </button>
        }
      </div>

      @if (offerNew()) {
        <div class="ui-list new">
          <button type="button" class="ui-row" (click)="newAccount.emit()">
            <app-badge shape="ci" [size]="40" builtin="add" fixed="#9b7bff"></app-badge>
            <span class="ui-tx">
              <b>{{ 'ui.import.newAccount' | t }}</b>
              <small>{{ 'ui.import.newAccount.hint' | t }}</small>
            </span>
            <ion-icon class="ui-chev" name="chevron-forward-outline"></ion-icon>
          </button>
        </div>
      }
    </div>
  </ng-template>
</ion-modal>
